{% extends "base.html" %}

{% block title %}Threat Actors / Affiliates{% endblock %}

{% block content %}

<section class="hero">
  <div class="container">
    <h1>Actors</h1>
    <p class="lead">Browse threat actors / affiliates.</p>
  </div>
</section>

<section class="metrics-section">
  <div class="container">

    <!-- Filters -->
    <div class="table-card search-card pad-mb">
      <div class="filters-wrap">
        <div class="filters">
          <div class="field field--search">
            <label class="sr-only" for="actors-filter">Search</label>
            <input id="actors-filter" class="input" type="search"
                   aria-label="Filter actors"
                   placeholder="Actor name or alias…">
            <button class="input-clear" type="button" aria-label="Clear search">×</button>
          </div>
        </div>
        <div class="filters-meta"><span id="flt-count"></span></div>
      </div>
    </div>

    <!-- Chip grid -->
    <div id="actors-grid" class="auto-grid">
      {% for e in data %}
        {# data: list of actor dicts: { name: str, aliases: [str], ... } #}
        <a class="group-chip stat-link"
           href="/actor/{{ e['name']|urlencode }}"
           data-name="{{ (e['name'] ~ ' ' ~ (e.get('aliases', [])|join(' ')))|lower }}">
          {{ e['name'].title() }}
        </a>
      {% endfor %}
    </div>

  </div>
</section>

<script type="application/json" id="chips-config">{"inputId":"actors-filter","gridId":"actors-grid","label":"actors"}</script>
<script src="{{ url_for('static', filename='js/chips-filter.js') }}" defer></script>

{% endblock %}
