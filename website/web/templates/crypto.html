{% extends "base.html" %}

{% block title %}Cryptocurrencies from Groups{% endblock %}

{% block content %}

<section class="hero">
  <div class="container">
    <h1>Groups with crypto</h1>
    <p class="lead">Browse cryptocurrency wallets grouped by actor.</p>
  </div>
</section>

<section class="metrics-section">
  <div class="container">

    <!-- Filters -->
    <div class="table-card search-card pad-mb">
      <div class="filters-wrap">
        <div class="filters">
          <div class="field field--search">
            <label class="sr-only" for="crypto-filter">Search</label>
            <input id="crypto-filter" class="input" type="search"
                   aria-label="Filter groups"
                   placeholder="Group name or alias…">
            <button class="input-clear" type="button" aria-label="Clear search">×</button>
          </div>
        </div>
        <div class="filters-meta"><span id="flt-count"></span></div>
      </div>
    </div>

    <!-- Grille de groupes -->
    <div id="groups-grid" class="auto-grid">
      {% for name in data %}
         {% for item in name %}
          <a class="group-chip stat-link"
             href="/crypto/{{ item }}"
             data-name="{{ item|lower }}{% if aliases and aliases.get(item) %} {{ aliases[item]|join(' ') }}{% endif %}">
             {{ item|title }}
          </a>
         {% endfor %}
      {% endfor %}
    </div>

  </div>
</section>

<script type="application/json" id="chips-config">{"inputId":"crypto-filter","gridId":"groups-grid","label":"groups"}</script>
<script src="{{ url_for('static', filename='js/chips-filter.js') }}" defer></script>

{% endblock %}
