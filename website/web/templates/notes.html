{% extends "base.html" %}

{% block title %}Notes from Groups (Admin){% endblock %}

{% block content %}

<section class="hero">
  <div class="container">
    <h1>Groups with notes</h1>
    <p class="lead">Browse ransomware note samples grouped by actor.</p>
  </div>
</section>

<section class="metrics-section">
  <div class="container">

    <!-- Filters -->
    <div class="table-card search-card pad-mb">
      <div class="filters-wrap">
        <div class="filters">
          <div class="field field--search">
            <label class="sr-only" for="notes-filter">Search</label>
            <input id="notes-filter" class="input" type="search"
                   aria-label="Filter groups"
                   placeholder="Group name or alias…">
            <button class="input-clear" type="button" aria-label="Clear search">×</button>
          </div>
        </div>
        <div class="filters-meta"><span id="flt-count"></span></div>
      </div>
    </div>

    <!-- Grille de groupes -->
    <div id="groups-grid" class="auto-grid">
      {% for entry in data %}
        {% for item in entry %}
          <a class="group-chip stat-link"
             href="{{ url_for('notesdetails',name=item) }}"
             data-name="{{ item|lower }} {% for a in (aliases_by_canon.get(item, [])) %}{{ a }} {% endfor %}">
            {{ item.title() }}
          </a>
        {% endfor %}
      {% endfor %}
    </div>

  </div>
</section>

<script type="application/json" id="chips-config">{"inputId":"notes-filter","gridId":"groups-grid","label":"groups"}</script>
<script src="{{ url_for('static', filename='js/chips-filter.js') }}" defer></script>

{% endblock %}
